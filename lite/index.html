<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f2ed" />
    <script>
      try {
        const wallpaper = localStorage.getItem('sully_lite_chat_background_v1');
        if (wallpaper) {
          const color = localStorage.getItem('sully_lite_chat_background_edge_v1') || '#202020';
          document.documentElement.dataset.liteWallpaper = 'true';
          document.documentElement.style.backgroundColor = color;
          document.documentElement.style.backgroundImage = 'linear-gradient(rgba(20, 20, 20, .08), rgba(20, 20, 20, .08)), url(' + JSON.stringify(wallpaper) + ')';
          document.querySelector('meta[name="theme-color"]').content = color;
        }
      } catch { /* Storage may be unavailable. */ }
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="cookie" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <title>cookie</title>
  </head>
  <body>
    <div id="lite-root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
